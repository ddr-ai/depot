name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Build sideload IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: App icon
        run: python3 ios/scripts/make_icon.py

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Depot.xcodeproj \
            -scheme Depot \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Depot.ipa
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products -name 'Depot.app' -type d | head -1)
          test -n "$APP"
          test -f "$APP/Info.plist"
          file "$APP/Depot"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Ad-hoc signature keeps the bundle intact. SideStore, AltStore,
          # Sideloadly, and Feather replace it with your Apple ID signature.
          codesign --force --sign - --deep Payload/Depot.app || true
          rm -f Depot.ipa
          ditto -c -k --keepParent Payload Depot.ipa
          unzip -l Depot.ipa | head -n 30
          test -s Depot.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Depot-ipa
          path: Depot.ipa
          if-no-files-found: error
          compression-level: 0

      - name: Publish the IPA on the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest Depot.ipa \
            --latest \
            --title "Depot for iPhone" \
            --notes "$(cat <<'EOF'
          Download **Depot.ipa** and sideload it.

          https://github.com/ddr-ai/depot/releases/download/ios-latest/Depot.ipa

          Open the file in SideStore, AltStore, Sideloadly, or Feather and sign it with your Apple ID. The build is unsigned on purpose so those tools can apply your signature.

          The Actions artifact is the same IPA, but GitHub wraps that download in a zip. This release asset is the IPA itself.

          Bundle ID: `io.github.ddr-ai.depot`
          EOF
          )"
